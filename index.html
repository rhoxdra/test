function drawBoardFrame() {
  if (isBorderOmitted) return;
  ctx.save();
  ctx.strokeStyle = isStoneShieldActive ? '#00e676' : 'rgba(224, 123, 70, 0.55)';
  ctx.lineWidth = isStoneShieldActive ? 4.5 : 2.5;
  ctx.shadowColor = isStoneShieldActive ? '#00e676' : 'rgba(224, 123, 70, 0.8)';
  ctx.shadowBlur = 12;
  
  const r = 12;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(VIRTUAL_WIDTH - r, 0);
  ctx.arcTo(VIRTUAL_WIDTH, 0, VIRTUAL_WIDTH, r, r);
  ctx.lineTo(VIRTUAL_WIDTH, VIRTUAL_HEIGHT - r);
  ctx.arcTo(VIRTUAL_WIDTH, VIRTUAL_HEIGHT, VIRTUAL_WIDTH - r, VIRTUAL_HEIGHT, r);
  ctx.lineTo(r, VIRTUAL_HEIGHT);
  ctx.arcTo(0, VIRTUAL_HEIGHT, 0, VIRTUAL_HEIGHT - r, r);
  ctx.lineTo(0, r);
  ctx.arcTo(0, 0, r, 0, r);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function mainRender(now) {
  const dt = Math.min(now - lastFrameTime, 80);
  lastFrameTime = now;

  const effectTimerContainer = document.getElementById('active-effect-timer');
  if (effectTimerContainer && gameStatus === 'PLAYING') {
    let activeEffectsHtml = '';
    
    if (windStormTimer > 0) {
      activeEffectsHtml += `<div class="effect-timer-node"><span>風壓</span><span>${windStormTimer.toFixed(1)}s</span></div>`;
    }
    if (isNegativeSealActive && negativeSealTimer > 0) {
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(21,101,192,0.85);"><span>恆定</span><span>${negativeSealTimer.toFixed(1)}s</span></div>`;
    }
    if (isSkillSealActive && skillSealTimer > 0) {
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(26,35,126,0.85);"><span>奪取</span><span>${skillSealTimer.toFixed(1)}s</span></div>`;
    }
    if (zeroGravityTimer > 0) {
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(0,229,255,0.75);"><span>漂浮</span><span>${zeroGravityTimer.toFixed(1)}s</span></div>`;
    }
    if (blackHoleTimer > 0) {
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(123,31,162,0.85);"><span>引力</span><span>${blackHoleTimer.toFixed(1)}s</span></div>`;
    }
    if (gravityEffectTimer > 0) {
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(85,85,85,0.85);"><span>重力</span><span>${gravityEffectTimer.toFixed(1)}s</span></div>`;
    }
    if (oaeSmallDropTimer > performance.now()) {
      const smallLeft = ((oaeSmallDropTimer - performance.now()) / 1000).toFixed(1);
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(130,119,23,0.85);"><span>壓制</span><span>${smallLeft}s</span></div>`;
    }
    if (shieldActiveEndTime > performance.now()) {
      const shieldLeft = ((shieldActiveEndTime - performance.now()) / 1000).toFixed(1);
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(0,230,118,0.85);"><span>恆定</span><span>${shieldLeft}s</span></div>`;
    }
    if (zarionBigDropEndTimer > performance.now()) {
      const bigDropLeft = ((zarionBigDropEndTimer - performance.now()) / 1000).toFixed(1);
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(255,167,38,0.85);"><span>成長</span><span>${bigDropLeft}s</span></div>`;
    }
    if (window.kokumeiChaosEndTimer && window.kokumeiChaosEndTimer > performance.now()) {
      const chaosLeft = ((window.kokumeiChaosEndTimer - performance.now()) / 1000).toFixed(1);
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(38,50,56,0.95); border:1px solid #78909c;"><span>混沌</span><span>${chaosLeft}s</span></div>`;
    }
    if (waterBonusEndTime > performance.now()) {
      const waterLeft = ((waterBonusEndTime - performance.now()) / 1000).toFixed(1);
      activeEffectsHtml += `<div class="effect-timer-node" style="background:rgba(41,182,246,0.85);"><span>加成</span><span>${waterLeft}s</span></div>`;
    }

    effectTimerContainer.innerHTML = activeEffectsHtml;
  } else if (effectTimerContainer) {
    effectTimerContainer.innerHTML = '';
  }

  const isHitStopping = now < hitStopUntil;

  if (gameStatus === 'PLAYING' && !isHitStopping) {
    if (lateralGravityTimer > 0) {
      lateralGravityTimer -= dt / 1000;
      if (lateralGravityTimer <= 0) {
        engine.gravity.x = 0;
      }
    }
    if (skillSealTimer > 0) {
      skillSealTimer -= dt / 1000;
      if (skillSealTimer <= 0) {
        skillSealTimer = 0;
        isSkillSealActive = false;
      }
    }
    if (negativeSealTimer > 0) {
      negativeSealTimer -= dt / 1000;
      if (negativeSealTimer <= 0) {
        negativeSealTimer = 0;
        isNegativeSealActive = false;
      }
    }
    if (gravityEffectTimer > 0) {
      gravityEffectTimer -= dt / 1000;
      if (gravityEffectTimer <= 0) {
        gravityEffectTimer = 0;
        if (!isStoneShieldActive) engine.gravity.y = BASE_GRAVITY;
      }
    }

    if (zeroGravityTimer > 0) {
      balls.forEach(b => {
        const speed = Math.hypot(b.velocity.x, b.velocity.y);
        if (speed > 1.5) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(b.position.x - b.velocity.x * 1.5, b.position.y - b.velocity.y * 1.5, b.radius * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = b.charData.border || '#00e5ff';
          ctx.globalAlpha = 0.35;
          ctx.shadowColor = '#00e5ff';
          ctx.shadowBlur = 15;
          ctx.fill();
          ctx.restore();
        }
      });
    }

    if (windStormTimer > 0) {
      windStormTimer -= dt / 1000;
      const cx = windCenter.x;
      const cy = windCenter.y;
      balls.forEach(b => {
        Matter.Sleeping.set(b, false);
        b.friction = 0.02;

        const dx = b.position.x - cx;
        const dy = b.position.y - cy;
        const dist = Math.hypot(dx, dy) || 1;
        const forceFactor = 0.0007;
        const spinFactor = 0.0015 * windStormSpinDir; // 依當前方向加入切向旋轉力
        Body.applyForce(b, b.position, {
          x: ((-dy / dist) * spinFactor + (dx / dist) * forceFactor) * b.mass + (Math.random() - 0.5) * 0.0005,
          y: ((dx / dist) * spinFactor + (dy / dist) * forceFactor) * b.mass - 0.0004 * b.mass
        });
      });
      if (windStormTimer <= 0) {
        windStormSpinDir *= -1; // 結束後切換下一次的旋轉方向
        balls.forEach(b => { b.friction = 0.18; });
      }
    } else {
      balls.forEach(b => { b.friction = 0.18; });
    }

    if (magneticTimer > 0) {
      magneticTimer -= dt / 1000;
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const b1 = balls[i];
          const b2 = balls[j];
          const dx = b2.position.x - b1.position.x;
          const dy = b2.position.y - b1.position.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 75) {
            const force = (b1.polarity === b2.polarity ? -0.00045 : 0.00015) / d;
            Body.applyForce(b1, b1.position, { x: (dx / d) * force * b1.mass, y: (dy / d) * force * b1.mass });
            Body.applyForce(b2, b2.position, { x: -(dx / d) * force * b2.mass, y: -(dy / d) * force * b2.mass });
          }
        }
      }
    }

    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (b.isBomb) {
        b.bombTimer -= dt / 1000;
        if (b.bombTimer <= 0) {
          playSynthPopSFX();
          createVFX(b.position.x, b.position.y, '#ff1744', 22);
          spawnPixiExplosion(b.position.x, b.position.y, 0xff1744, 30);
          updateScore(-1500);

          // 1. 徹底消除引爆的超載珠本體並移出盤面
          World.remove(world, b);
          balls.splice(i, 1);

          // 2. 判斷高和「恆定」免疫狀態
          if (isNegativeSealActive) {
            showBanner('【超載珠引爆】扣除 1500 分！（恆定抵消擴散）');
          } else {
            showBanner('【超載珠引爆】扣除 1500 分並引發連鎖擴散！');

            // 3. 從場上剩餘的球中選出 1 顆可感染的目標
            const infectCandidates = balls.filter(target => 
              !target.isSpecialOrb && 
              !target.isAttributePending && 
              !target.isBomb && 
              !target.isBlackBall
            );
            
            infectCandidates.sort(() => Math.random() - 0.5).slice(0, 1).forEach(target => {
              target.isBomb = true;
              target.bombTimer = 15.0;
              // 清除所有既有妨礙與增益標籤，避免狀態衝突
              target.isBlackBall = false;
              target.isFrozenBall = false;
              target.isGreenBall = false;
              target.isGoldBall = false;
              target.isChainLocked = false;
              target.isFrenzy = false;
              target.isHourglass = false;
              target.isBlindBlack = false;
              createVFX(target.position.x, target.position.y, '#ff1744', 14);
            });
          }

          // 補回被炸掉消除的珠子，維持盤面平衡
          setTimeout(() => refillBalls(MAX_BALLS), 300);
        }
      }
    }

    if (blackHoleTimer > 0) {
      blackHoleTimer -= dt / 1000;
      balls.forEach(b => {
        Matter.Sleeping.set(b, false);
        b.friction = 0.01;

        const dx = blackHolePos.x - b.position.x;
        const dy = blackHolePos.y - b.position.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist > 12) {
          const pull = 0.003 * b.mass;
          const spin = 0.0015 * b.mass * blackHoleSpinDir; // 依據當前方向順/逆時針旋轉
          const antiGravity = b.position.y > VIRTUAL_HEIGHT * 0.6 ? -0.0008 * b.mass : 0; 
          Body.applyForce(b, b.position, {
            x: (dx / dist) * pull + (-dy / dist) * spin,
            y: (dy / dist) * pull + (dx / dist) * spin + antiGravity
          });
        }
      });
      if (blackHoleTimer <= 0) {
        blackHoleSpinDir *= -1; // 每次發動完畢後交替順/逆時針方向
        balls.forEach(b => { b.friction = 0.18; });
        createVFX(blackHolePos.x, blackHolePos.y, '#9c27b0', 28);
        spawnPixiExplosion(blackHolePos.x, blackHolePos.y, 0x9c27b0, 40);
      }
    }

    if (zeroGravityTimer > 0) {
      zeroGravityTimer -= dt / 1000;
      balls.forEach(b => {
        Body.applyForce(b, b.position, {
          x: Math.sin(now * 0.003 + b.id) * 0.00015 * b.mass,
          y: Math.cos(now * 0.003 + b.id) * 0.00015 * b.mass
        });
      });
      if (zeroGravityTimer <= 0) {
        engine.gravity.y = BASE_GRAVITY;
        balls.forEach(b => { b.frictionAir = 0.034; });
      }
    }

    if (rotatingBarriers.length > 0 && barrierTimer > 0) {
      barrierTimer -= dt / 1000;
      rotatingBarriers.forEach(rb => {
        Body.setAngle(rb.body, rb.body.angle + rb.speed);
      });
      if (barrierTimer <= 0) {
        rotatingBarriers.forEach(rb => {
          createVFX(rb.body.position.x, rb.body.position.y, '#42a5f5', 16);
          World.remove(world, rb.body);
        });
        rotatingBarriers = [];
      }
    }

    physicsAccumulator += dt;
    let steps = 0;
    while (physicsAccumulator >= FIXED_STEP && steps < 4) {
      Engine.update(engine, FIXED_STEP);
      physicsAccumulator -= FIXED_STEP;
      steps++;
    }
    if (physicsAccumulator > FIXED_STEP * 2) physicsAccumulator = 0;

    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (b.position.y < -300 || b.position.x < -100 || b.position.x > VIRTUAL_WIDTH + 100) {
        Body.setPosition(b, { x: Math.random() * VIRTUAL_WIDTH, y: -50 });
        Body.setVelocity(b, { x: 0, y: 2 });
      }
      if (b.velocity.y > MAX_FALL_VELOCITY) Body.setVelocity(b, { x: b.velocity.x, y: MAX_FALL_VELOCITY });
      if (Math.abs(b.velocity.x) > MAX_FALL_VELOCITY) Body.setVelocity(b, { x: Math.sign(b.velocity.x) * MAX_FALL_VELOCITY, y: b.velocity.y });
    }
  }

  rotationCounter += 0.026;
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let shakeX = 0;
  let shakeY = 0;
  if (screenShakeTimer > 0) {
    screenShakeTimer -= dt / 1000;
    shakeX = (Math.random() - 0.5) * 20;
    shakeY = (Math.random() - 0.5) * 20;
  }

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(offsetX + shakeX, offsetY + shakeY);
  ctx.scale(scaleFactor, scaleFactor);

  const isSkillCountGoal = selectedVariant && selectedVariant.goalType === 'skillCount';
  const pct = isSkillCountGoal ? (currentStageSkillCount / targetSkillCount) : (currentScore / stageTargetScore);
  const isHighTension = pct >= 0.8 || performance.now() < waterBonusEndTime;
  const glowAlpha = 0.3 + Math.sin(now * 0.006) * 0.2;
  ctx.save();
  ctx.strokeStyle = isHighTension ? `rgba(245, 166, 35, ${glowAlpha + 0.35})` : `rgba(224, 123, 70, ${glowAlpha + 0.15})`;
  ctx.lineWidth = isHighTension ? 9 : 5;
  ctx.shadowColor = isHighTension ? '#f5a623' : '#e07b46';
  ctx.shadowBlur = isHighTension ? 26 : 14;
  ctx.strokeRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
  ctx.restore();

  drawBoardFrame();

  for (let i = chainLasers.length - 1; i >= 0; i--) {
    const laser = chainLasers[i];
    laser.life -= 0.055;
    if (laser.life <= 0) {
      chainLasers.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.beginPath();
    laser.points.forEach((pt, pIdx) => {
      if (pIdx === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    });
    ctx.strokeStyle = laser.color;
    ctx.lineWidth = 10 * laser.life;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = laser.color;
    ctx.shadowBlur = 20;
    ctx.globalAlpha = Math.max(0, laser.life);
    ctx.stroke();
    ctx.restore();
  }

  if (fusionBeams && fusionBeams.length > 0) {
    ctx.save();
    ctx.beginPath();
    fusionBeams.forEach(b => { ctx.moveTo(b.from.position.x, b.from.position.y); ctx.lineTo(b.to.position.x, b.to.position.y); });
    ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.shadowColor = '#ff3d00'; ctx.shadowBlur = 22; ctx.stroke();
    ctx.restore();
  }

  balls.forEach(b => {
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);

    const speed = Math.hypot(b.velocity.x, b.velocity.y);
    if (speed > 5.0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, b.radius * 0.9, 0, Math.PI * 2);
      ctx.fillStyle = b.charData.border || '#00e5ff';
      ctx.globalAlpha = 0.35;
      ctx.shadowColor = b.charData.border || '#00e5ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();
    }

    const cacheKey = b.isSpecialOrb ? (b.charData.id + '_special') : b.charData.id;
    const imgCache = charImageCache[cacheKey] || charImageCache[b.charData.id];
    const r = b.radius;

    if (imgCache && !b.isBlindBlack) {
      ctx.drawImage(imgCache, -r, -r, r * 2, r * 2);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = b.isBlindBlack ? '#111216' : b.charData.color;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = b.charData.border;
      ctx.stroke();
    }

    if (b.isBlackBall || b.isLeadBall) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = b.isLeadBall ? 'rgba(20, 24, 30, 0.95)' : 'rgba(30, 30, 30, 0.88)'; ctx.fill();
    }

    if (b.isFrozenBall) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 229, 255, 0.45)'; ctx.fill();
    }

    if (b.isGreenBall) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(76, 175, 80, 0.6)'; ctx.fill();
    }

    if (b.isHourglass) {
      ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
      ctx.lineWidth = 4; 
      ctx.strokeStyle = '#29b6f6'; 
      ctx.shadowColor = '#29b6f6'; 
      ctx.shadowBlur = 10; 
      ctx.stroke();
    }

    if (b.isFrenzy) {
      ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#e07b46'; ctx.shadowColor = '#e07b46'; ctx.shadowBlur = 10; ctx.stroke();
    }

    if (b.isGoldBall) {
      ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10; ctx.stroke();
    }

    if (b.isBlackBall) {
      ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#757575'; ctx.stroke();
    }

    if (b.isFrozenBall) {
      ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#00e5ff'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10; ctx.stroke();
    }

    if (b.isGreenBall) {
      ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#69f0ae'; ctx.stroke();
    }

    if (b.isBlindBlack) {
      ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#7c4dff'; ctx.stroke();
    }

    if (b.isChainLocked) {
      ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#cfd8dc';
      ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    }

    if (b.isBomb) {
      ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
      ctx.lineWidth = 4.5; ctx.strokeStyle = '#ff1744'; ctx.shadowColor = '#ff1744'; ctx.shadowBlur = 12; ctx.stroke();
      ctx.font = '900 13px sans-serif';
      ctx.fillStyle = '#ff1744';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil(b.bombTimer), 0, 0);
    }

    if (b.isAttributePending) {
      ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = '#ffeb3b';
      ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 12;
      ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
    }

    if (b.isSpecialOrb) {
      ctx.rotate(rotationCounter);
      ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
      ctx.lineWidth = 4.5; ctx.strokeStyle = '#ffd700';
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
      ctx.setLineDash([8, 5]); ctx.stroke(); ctx.setLineDash([]);
    }

    ctx.restore();
  });

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += 3.2;
    sw.alpha -= 0.04;
    if (sw.alpha <= 0 || sw.r >= sw.maxR) {
      shockwaves.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4 * sw.alpha;
    ctx.globalAlpha = Math.max(0, sw.alpha);
    ctx.shadowColor = sw.color;
    ctx.shadowBlur = 16;
    ctx.stroke();
    ctx.restore();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.022;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill(); ctx.globalAlpha = 1;
  }

  for (let i = floatingScores.length - 1; i >= 0; i--) {
    const fs = floatingScores[i];
    fs.y += fs.vy; 
    fs.life -= 0.022;
    if (fs.scale > 1.0) fs.scale = Math.max(1.0, fs.scale - 0.045);
    if (fs.life <= 0) { floatingScores.splice(i, 1); continue; }

    ctx.save();
    ctx.translate(fs.x, fs.y);
    ctx.scale(fs.scale, fs.scale);
    ctx.font = fs.isCritical ? '900 24px -apple-system, sans-serif' : '900 20px -apple-system, sans-serif';
    ctx.textAlign = 'center'; 
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = Math.max(0, fs.life);
    ctx.fillStyle = fs.isCritical ? '#ffeb3b' : fs.color;
    ctx.shadowColor = fs.isCritical ? '#ff5722' : fs.color;
    ctx.shadowBlur = 20;
    ctx.fillText(fs.isCritical ? `${fs.text}!` : fs.text, 0, 0);
    ctx.restore();
  }

  ctx.restore();
  requestAnimationFrame(mainRender);
}

requestAnimationFrame(mainRender);
</script>
</body>
