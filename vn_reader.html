    const chaptersData = announcements.map((item, idx) => {
      let storySteps = [];

      if (item.story && Array.isArray(item.story)) {
        let lastBgUrl = item.bgImage;
        storySteps = item.story.map(s => {
          if (s.bgUrl && s.bgUrl.trim() !== "") {
            lastBgUrl = s.bgUrl;
          }
          return {
            speaker: s.speaker || "",
            avatar: s.avatar || "",
            expr: s.expr || "neutral",
            text: s.text || "",
            bgUrl: lastBgUrl
          };
        });
      } else if (item.rawText) {
        const paragraphs = item.rawText.split(/\n\n+/).map(p => p.trim()).filter(p => p.length > 0);
        storySteps = paragraphs.map(paragraph => {
          let speaker = "";
          let text = paragraph;

          const match = paragraph.match(/^([^\n：「」]+)[：:]([\s\S]+)$/);
          if (match) {
            speaker = match[1].trim();
            text = match[2].trim();
          }

          return {
            speaker: speaker,
            avatar: "",
            expr: "neutral",
            text: text,
            bgUrl: item.bgImage
          };
        });
      }

      return {
        title: item.title,
        badge: item.badge,
        bgImage: item.bgImage,
        story: storySteps
      };
    });

    let typingTimer = null;
    let isTyping = false;
    let fullTextToType = "";

    let currentChapterIndex = 0;
    let currentStepIndex = 0;
    let isAuto = false;
    let autoTimer = null;
    let currentActiveBgLayer = 1;

    function getCurrentStory() {
      return chaptersData[currentChapterIndex].story;
    }

    function renderStep() {
      const story = getCurrentStory();
      const data = story[currentStepIndex];

      if (autoTimer) clearTimeout(autoTimer);

      const speakerEl = document.getElementById('speaker-name');
      const dialogueBox = document.getElementById('dialogue-box');
      const contentTextEl = document.getElementById('content-text');
      const avatarWrapper = document.getElementById('avatar-wrapper');
      const avatarSprite = document.getElementById('avatar-sprite');

      if (data.speaker && data.speaker.trim() !== "") {
        speakerEl.innerText = data.speaker;
        dialogueBox.classList.remove('no-speaker');
      } else {
        speakerEl.innerText = "";
        dialogueBox.classList.add('no-speaker');
      }

      if (data.avatar && data.avatar.trim() !== "") {
        avatarWrapper.style.display = 'block';
        avatarSprite.style.backgroundImage = `url('${data.avatar}')`;
        avatarSprite.className = `expr-${data.expr || 'neutral'}`;
      } else {
        avatarWrapper.style.display = 'none';
      }

      if (typingTimer) clearInterval(typingTimer);
      fullTextToType = data.text;
      contentTextEl.innerText = "";
      isTyping = true;

      let charIndex = 0;
      const typingSpeed = 15;

      typingTimer = setInterval(() => {
        if (charIndex < fullTextToType.length) {
          contentTextEl.innerText += fullTextToType.charAt(charIndex);
          charIndex++;
        } else {
          clearInterval(typingTimer);
          isTyping = false;
          if (isAuto) scheduleAutoNext();
        }
      }, typingSpeed);

      const targetBgUrl = data.bgUrl || "";
      const bg1El = document.getElementById('bg1');
      const bg2El = document.getElementById('bg2');
      const currentActiveEl = currentActiveBgLayer === 1 ? bg1El : bg2El;
      const currentInactiveEl = currentActiveBgLayer === 1 ? bg2El : bg1El;

      if (!currentActiveEl.style.backgroundImage.includes(encodeURI(targetBgUrl))) {
        currentInactiveEl.style.backgroundImage = `url('${targetBgUrl}')`;
        currentInactiveEl.classList.add('active');
        currentActiveEl.classList.remove('active');
        currentActiveBgLayer = currentActiveBgLayer === 1 ? 2 : 1;

        const absoluteUrl = new URL(targetBgUrl, window.location.href).href;
        window.parent.postMessage({ type: 'CHANGE_BG', bgUrl: absoluteUrl }, '*');
      }

      document.getElementById('progress-tag').innerText = `【${chaptersData[currentChapterIndex].title}】 ${currentStepIndex + 1} / ${story.length}`;
    }

    function handleStageClick() {
      if (document.body.classList.contains('vn-ui-hidden')) {
        document.body.classList.remove('vn-ui-hidden');
        return;
      }

      if (isTyping) {
        if (typingTimer) clearInterval(typingTimer);
        document.getElementById('content-text').innerText = fullTextToType;
        isTyping = false;
        if (isAuto) scheduleAutoNext();
        return;
      }

      handleAdvance();
    }

    function handleAdvance() {
      const story = getCurrentStory();
      if (currentStepIndex < story.length - 1) {
        currentStepIndex++;
        renderStep();
      } else {
        if (isAuto) stopAuto();
      }
    }

    function handleBack() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderStep();
      }
    }

    function toggleVnUI(e) {
      if (e) e.stopPropagation();
      document.body.classList.toggle('vn-ui-hidden');
    }

    function scheduleAutoNext() {
      if (!isAuto) return;
      if (autoTimer) clearTimeout(autoTimer);
      
      autoTimer = setTimeout(() => {
        if (!isAuto) return;
        const story = getCurrentStory();
        if (currentStepIndex < story.length - 1) {
          handleAdvance();
        } else {
          stopAuto();
        }
      }, 2000);
    }

    function toggleAuto() {
      isAuto = !isAuto;
      const btn = document.getElementById('auto-btn');
      if (isAuto) {
        btn.classList.add('active');
        btn.innerText = "⏸ Auto (2s)";
        if (!isTyping) {
          scheduleAutoNext();
        }
      } else {
        stopAuto();
      }
    }

    function stopAuto() {
      isAuto = false;
      if (autoTimer) clearTimeout(autoTimer);
      const btn = document.getElementById('auto-btn');
      btn.classList.remove('active');
      btn.innerText = "► Auto";
    }

    function openLogModal() {
      if (isAuto) stopAuto();
      const story = getCurrentStory();
      const logBody = document.getElementById('log-body');
      logBody.innerHTML = "";

      for (let i = 0; i <= currentStepIndex; i++) {
        const item = story[i];
        const logItem = document.createElement('div');
        logItem.className = 'log-item';
        logItem.innerHTML = `
          ${item.speaker ? `<div style="font-size:0.85rem; color:#38bdf8; font-weight:bold; margin-bottom:4px;">${item.speaker}</div>` : ''}
          <div class="log-text">${item.text}</div>
        `;
        logBody.appendChild(logItem);
      }

      document.getElementById('log-modal').style.display = 'flex';

      requestAnimationFrame(() => {
        logBody.scrollTop = logBody.scrollHeight;
      });
    }

    function closeLogModal() {
      document.getElementById('log-modal').style.display = 'none';
    }

    function openChapterModal() {
      if (isAuto) stopAuto();
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = "";

      chaptersData.forEach((ch, idx) => {
        const card = document.createElement('div');
        card.className = `chapter-card ${idx === currentChapterIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div class="chapter-card-title">${ch.title}</div>
          <div class="chapter-card-badge">${ch.badge}</div>
        `;
        card.onclick = (e) => {
          e.stopPropagation();
          currentChapterIndex = idx;
          currentStepIndex = 0;
          closeChapterModal();
          renderStep();
        };
        listEl.appendChild(card);
      });

      document.getElementById('chapter-modal').style.display = 'flex';
    }

    function closeChapterModal() {
      document.getElementById('chapter-modal').style.display = 'none';
    }

    window.addEventListener('keydown', function(e) {
      const chapterModal = document.getElementById('chapter-modal');
      const logModal = document.getElementById('log-modal');
      const isModalOpen = (chapterModal && chapterModal.style.display === 'flex') ||
                          (logModal && logModal.style.display === 'flex');

      if (isModalOpen) {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
        }
        return;
      }

      if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleAdvance();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        handleBack();
      }
    });

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'CHANGE_BG') {
        const bgUrl = e.data.bgUrl;
        if (bgUrl) {
          document.body.style.setProperty('--bg-image', `url('${bgUrl}')`);
        }
      }
    });

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'SELECT_CHAPTER_INDEX') {
        const idx = e.data.index;
        if (idx >= 0 && idx < chaptersData.length) {
          currentChapterIndex = idx;
          currentStepIndex = 0;
          renderStep();
        }
      }
    });

    document.getElementById('bg1').style.backgroundImage = `url('${getCurrentStory()[0].bgUrl}')`;
    renderStep();

    window.addEventListener('DOMContentLoaded', () => {
        if (window.innerWidth <= 768) {
            const btns = document.querySelectorAll('#controls-bar .ctrl-btn');
            btns.forEach(btn => {
                if (btn.innerText.includes('篇章')) btn.innerText = '☰ 篇章';
                if (btn.innerText.includes('Auto')) btn.innerText = '► Auto';
                if (btn.innerText.includes('履歷')) btn.innerText = 'Log';
                if (btn.innerText.includes('隱藏')) btn.innerText = '隱藏';
            });
        }
    });
  </script>
</body>
